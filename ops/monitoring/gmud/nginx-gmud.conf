# Include only in the existing private default_server listening on 8088.
location = /gmud-metrics {
    allow 10.20.0.0/16;
    allow 127.0.0.1;
    deny all;
    alias /var/lib/cosmotech-gmud-observer/gmud.prom;
    default_type text/plain;
    add_header Cache-Control "no-store";
    access_log off;
}
