# Include only inside the existing default_server on private port 8088.
# Known public hostnames use other server blocks; no public route serves metrics.
location = /lab-metrics {
    allow 10.20.0.0/16;
    allow 127.0.0.1;
    deny all;
    alias /var/lib/cosmotech-monitoring/lab.prom;
    default_type text/plain;
    add_header Cache-Control "no-store";
    access_log off;
}
