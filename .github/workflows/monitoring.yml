name: validate-observability
on:
  push:
    branches: [main]
    paths: [src/**, scripts/**, tests/**, ops/monitoring/**, ops/zabbix/**, requirements-dev.txt, .github/workflows/monitoring.yml]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_lab_monitoring.py tests/test_codex_quota.py -q
      - run: python -m compileall -q src scripts ops/zabbix
      - run: bash -n scripts/install_lab_monitoring.sh ops/zabbix/install.sh
      - run: python scripts/build_lab_dashboards.py
      - run: git diff --exit-code -- ops/grafana/dashboards
