name: validate-observability
on:
  push:
    branches: [main]
    paths: [src/**, scripts/**, tests/**, ops/monitoring/**, ops/zabbix/**, ops/zabbix-monitoring/**, ops/helm/**, requirements-dev.txt, .github/workflows/monitoring.yml]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_lab_monitoring.py tests/test_codex_quota.py tests/test_zabbix_monitoring.py tests/test_sqs_canary_metrics.py -q
      - run: python -m compileall -q src scripts ops/zabbix ops/zabbix-monitoring
      - run: bash -n scripts/install_lab_monitoring.sh ops/zabbix/install.sh
      - run: python scripts/build_lab_dashboards.py
      - run: python scripts/build_connectivity_dashboard.py
      - run: python scripts/build_command_center_dashboard.py
      - run: python scripts/build_sqs_worker_dashboard.py
      - name: Validate PromQL and alert firing/recovery
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD:/work" -w /work prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check rules ops/monitoring/v2-sqs-worker-rules.json
          docker run --rm --entrypoint /bin/promtool -v "$PWD:/work" -w /work prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules tests/fixtures/v2-sqs-alert-tests.json
      - run: git diff --exit-code -- ops/grafana/dashboards
